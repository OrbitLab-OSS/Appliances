name: release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PANTS_CONFIG_FILES: pants.ci.toml

jobs:
  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.APPLIANCES_DEPLOY_KEY }}

      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure Pants caching to GitHub Actions Cache
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('PANTS_REMOTE_STORE_ADDRESS', process.env.ACTIONS_CACHE_URL);
            core.exportVariable('PANTS_REMOTE_OAUTH_BEARER_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);

      - name: Install Pants
        run: curl --proto '=https' --tlsv1.2 -fsSL https://static.pantsbuild.org/setup/get-pants.sh | bash

      - name: Pants Lint
        run: pants lint all

      - name: Pants Test
        run: pants test all

      - name: Pants Build
        run: pants package all

      - name: List Appliances
        run: ls -latr dist/appliance/**/*

      - name: Commit metadata
        run: |
          sudo apt install -y jq
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          declare -a appliances=()
          for file in dist/appliance/**/*; do
            FILENAME=$(basename "$file")
            metadata=$(
              jq -n --arg filename "$FILENAME" \
              --arg digest "sha256:$(sha256sum "$file" | awk '{print $1}')" \
              --arg size $(stat -c%s "$file") \
              --arg download_url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/$FILENAME" \
              '{"filename":$filename,"digest":$digest,"size":$size,"browser_download_url":$download_url}'
            )
            appliances+=("$metadata")
          done
          assets=$(jq -c -n '$ARGS.positional' --jsonargs "${appliances[@]}")
          mkdir -p metadata
          rm -f metadata/appliances.json
          jq -n --arg version "$VERSION" \
            --arg published_at "$DATE" \
            --argjson appliances "$assets" \
            '{"version": $version, "published_at": $published_at, "appliances": $appliances}' > metadata/appliances.json
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add metadata/appliances.json
          git commit -m "Update metadata for v$VERSION"
          git push origin HEAD:main

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OrbitLab Infrastructure v${{ steps.version.outputs.version }}
          files: dist/appliance/**/*
